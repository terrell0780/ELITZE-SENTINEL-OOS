[project]
name = "Frontier-enterprise"
version = "1.0.0"
description = "Frontier Enterprise — Operating Layer: SSO, RBAC, Multi-tenancy, Compliance, Monitoring, Kubernetes"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
