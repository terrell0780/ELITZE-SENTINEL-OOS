[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frontier-code"
version = "0.1.0"
description = "Terminal coding agent — Frontier's answer to Claude Code / Codex"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "pygments>=2.17",
    "click>=8.0",
]

[project.scripts]
frontier-code = "src.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
